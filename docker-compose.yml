
services:
  backend:
    build: ./rag_app/backend
    container_name: rag_backend
    ports:
      - "8000:8000"
    env_file:
      -  .env
    restart: always

  frontend:
    build: ./rag_app/frontend
    container_name: rag_frontend
    ports:
      - "8501:8501"
    env_file:
      -  .env
    depends_on:
      - backend
    restart: always
