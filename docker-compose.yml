
services:
  backend:
    build: ./rag_app/backend
    container_name: rag_backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${API_KEY}  # Make sure to set this in your .env file or environment
    restart: always

  frontend:
    build: ./rag_app/frontend
    container_name: rag_frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000/api  # If your front-end uses this variable to reach the backend
    depends_on:
      - backend
    restart: always
